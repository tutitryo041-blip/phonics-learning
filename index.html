<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>カタカナ フォニックス</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>カタカナ フォニックス</h1>
    <nav>
      <button type="button" data-go="home" class="link">ホーム</button>
      <button type="button" data-go="history" class="link">りれき</button>
    </nav>
  </header>

  <main>
    <!-- ホーム -->
    <section id="home" class="screen">
      <p class="day" id="home-day"></p>
      <div class="card">
        <ul class="messages" id="home-messages"></ul>
        <p class="counts" id="home-counts"></p>
        <button type="button" class="big" id="btn-start">はじめる</button>
      </div>
      <div class="card progress">
        <p class="label">すすみぐあい</p>
        <div class="bar"><div class="bar-fill" id="home-bar"></div></div>
        <p id="home-progress"></p>
      </div>
    </section>

    <!-- ルールの せつめい -->
    <section id="rule" class="screen" hidden>
      <div class="card">
        <p class="label" id="rule-label">きょうの ルール</p>
        <div id="rule-body"></div>
        <button type="button" class="big" id="btn-rule-ok">わかった！ もんだいへ</button>
      </div>
    </section>

    <!-- もんだい -->
    <section id="quiz" class="screen" hidden>
      <div class="quiz-head">
        <span id="quiz-num"></span>
        <span class="badge" id="quiz-kind"></span>
        <button type="button" class="link" id="btn-show-rule">ルールを みる</button>
      </div>
      <div class="bar small"><div class="bar-fill" id="quiz-bar"></div></div>
      <div class="card quiz-card">
        <p class="prompt">カタカナで よみかたを かいてね</p>
        <p class="word" id="quiz-word" lang="en"></p>
        <form id="quiz-form" autocomplete="off">
          <input id="quiz-input" type="text" inputmode="text" lang="ja"
                 autocomplete="off" autocapitalize="off" spellcheck="false"
                 placeholder="ここに カタカナ" aria-label="カタカナで こたえ">
          <button type="submit" class="big" id="btn-answer">こたえる</button>
        </form>
        <div id="feedback" class="feedback" hidden>
          <p class="mark" id="fb-mark"></p>
          <p id="fb-text"></p>
          <p class="hint" id="fb-hint"></p>
          <button type="button" class="big" id="btn-next">つぎへ</button>
        </div>
      </div>
    </section>

    <!-- けっか -->
    <section id="result" class="screen" hidden>
      <div class="card">
        <p class="label">きょうの けっか</p>
        <p class="score" id="res-score"></p>
        <p class="res-msg" id="res-msg"></p>
        <div id="res-missed"></div>
        <p class="next" id="res-next"></p>
        <button type="button" class="big" data-go="home">ホームへ</button>
      </div>
    </section>

    <!-- りれき -->
    <section id="history" class="screen" hidden>
      <div class="card">
        <p class="label">がくしゅうの りれき</p>
        <div id="hist-list"></div>
      </div>
      <div class="card tools">
        <p class="label">データの ほぞん</p>
        <p class="small-text">りれきは この ブラウザに ほぞん されます。べつの たんまつに うつす ときや、バックアップに つかってね。</p>
        <div class="row">
          <button type="button" id="btn-export">かきだす（JSON）</button>
          <label class="file-btn">よみこむ<input type="file" id="file-import" accept="application/json,.json" hidden></label>
          <button type="button" class="danger" id="btn-reset">さいしょから</button>
        </div>
      </div>
    </section>
  </main>

  <script src="js/curriculum.js"></script>
  <script src="js/judge.js"></script>
  <script src="js/planner.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
